buildscript {
    repositories {
        mavenCentral()
        maven { name = 'forge'; url = 'https://maven.minecraftforge.net/' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

apply plugin: 'forge'
apply plugin: 'maven-publish'

version = '1.0.0'
group = 'com.glowingfederal'
archivesBaseName = 'LegacyProfiler'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

minecraft {
    version = '1.7.10-10.13.4.1614-1.7.10'
    runDir = 'run'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') {
        expand(version: project.version)
    }
}

jar {
    manifest {
        attributes 'Implementation-Title': 'Legacy Profiler',
                'Implementation-Version': version,
                'Automatic-Module-Name': 'com.glowingfederal.legacyprofiler'
    }
}

publishing {
    publications {
        legacyProfiler(MavenPublication) {
            groupId = project.group
            artifactId = 'legacy-profiler'
            version = project.version

            artifact jar
        }
    }
}

build.dependsOn reobf
publishToMavenLocal.dependsOn reobf